name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript
        run: npm run lint:types

      - name: ESLint
        run: npm run lint:eslint

      - name: Prettier
        run: npm run lint:prettier

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

  deploy:
    name: Deploy Docker Compose
    needs: build
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - name: Deploy
        run: |
          docker-compose down 2>/dev/null || true
          docker-compose up -d --build
          docker-compose ps
