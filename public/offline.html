<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Нет подключения — НМЦК Калькулятор</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #f5f5f5;
        color: #333;
        text-align: center;
        padding: 24px;
      }
      .container {
        max-width: 420px;
      }
      .icon {
        font-size: 64px;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 24px;
        margin-bottom: 12px;
      }
      p {
        font-size: 16px;
        color: #666;
        margin-bottom: 24px;
        line-height: 1.5;
      }
      button {
        background: #1677ff;
        color: #fff;
        border: none;
        padding: 10px 24px;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
      }
      button:hover {
        background: #4096ff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">&#128268;</div>
      <h1>Нет подключения к сети</h1>
      <p>Проверьте интернет-соединение и попробуйте снова.</p>
      <button onclick="window.location.reload()">Обновить страницу</button>
    </div>
  </body>
</html>
